<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>หน้าร้าน</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1e2125;--muted:#6b6f76;--accent:#ee4d2d;--line:#e7e2d9}
@media (prefers-color-scheme:dark){:root{--bg:#15171c;--card:#1f2228;--ink:#f1f1f1;--muted:#a5a9b0;--line:#2c3038}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Sarabun,system-ui,sans-serif}
header{max-width:720px;margin:0 auto;padding:28px 16px 8px;text-align:center}
.av{width:88px;height:88px;border-radius:50%;object-fit:cover;border:3px solid var(--card);box-shadow:0 2px 10px rgba(0,0,0,.12)}
h1{font-size:24px;margin:10px 0 4px}.bio{color:var(--muted);margin:0 0 14px}
.links{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.links a{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
main{max-width:720px;margin:0 auto;padding:12px 16px 40px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){main{grid-template-columns:repeat(3,1fr)}}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.media{aspect-ratio:9/16;background:#000;position:relative}.media video,.media img{width:100%;height:100%;object-fit:cover;display:block}
.tx{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}.nm{font-weight:700;font-size:15px;line-height:1.3}
.ln{color:var(--muted);font-size:13px;line-height:1.35;flex:1}.buy{display:block;text-align:center;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:9px;border-radius:10px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 30px}
</style></head><body>
<header id="h"></header><main id="m"></main>
<footer>ลิงก์ในหน้านี้เป็นลิงก์ affiliate · ราคาและโปรโมชันดูที่ Shopee</footer>
<script>
const esc=(s)=>String(s||'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
fetch('data.json?'+Date.now()).then((r)=>r.json()).then((d)=>{
  const p=d.profile||{};document.title=p.name||'หน้าร้าน';
  const L=[['TikTok',p.tiktok],['Facebook',p.facebook],['YouTube',p.youtube],['ร้าน Shopee',p.shopee]].filter((x)=>x[1]);
  document.getElementById('h').innerHTML=(p.avatar?'<img class="av" src="'+esc(p.avatar)+'" alt="">':'')+'<h1>'+esc(p.name||'หน้าร้าน')+'</h1>'+(p.bio?'<p class="bio">'+esc(p.bio)+'</p>':'')+'<div class="links">'+L.map((x)=>'<a href="'+esc(x[1])+'" target="_blank" rel="noopener">'+esc(x[0])+'</a>').join('')+'</div>';
  const m=document.getElementById('m');const items=d.items||[];
  if(!items.length){m.innerHTML='<p class="empty">ยังไม่มีสินค้า</p>';return}
  m.innerHTML=items.map((i)=>'<div class="it"><div class="media">'+(i.video?'<video muted loop playsinline preload="none" poster="'+esc(i.image)+'" data-src="'+esc(i.video)+'"></video>':'<img loading="lazy" src="'+esc(i.image)+'" alt="">')+'</div><div class="tx"><div class="nm">'+esc(i.name)+'</div><div class="ln">'+esc(i.line)+'</div><a class="buy" href="'+esc(i.link)+'" target="_blank" rel="noopener nofollow sponsored">ซื้อที่ Shopee</a></div></div>').join('');
  const io=new IntersectionObserver((es)=>es.forEach((e)=>{const v=e.target;if(e.isIntersecting){if(!v.src)v.src=v.dataset.src;v.play().catch(()=>{})}else v.pause()}),{threshold:.4});
  document.querySelectorAll('video').forEach((v)=>io.observe(v));
}).catch(()=>{document.getElementById('m').innerHTML='<p class="empty">โหลดไม่ได้ ลองใหม่อีกครั้ง</p>'});
</script></body></html>
